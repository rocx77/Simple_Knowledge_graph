# Project-level Streamlit configuration.
#
# Kept minimal and local: the app must present well offline, so no Google Fonts and no
# remote theme assets. The graph palette lives in ui/theme.py, not here, because these
# values cannot express per-entity-type colours.
[theme]
base = "light"
# Streamlit's default primary (#FF4B4B / #4C8DF6 depending on version) paints the
# multiselect chips and the primary button. Chosen so WHITE text on that fill clears
# WCAG AA 4.5:1 -- measured 5.47:1 on #FFFFFF and 5.04:1 on the secondary background.
# The previous #4C8DF6 gave only 3.26:1, which fails AA for the 14px chip labels.
primaryColor = "#2A66C9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1B2733"
font = "sans serif"

[server]
# The artifacts are small and local; a long headless delay only gets in the way of a demo.
headless = true

[browser]
gatherUsageStats = false